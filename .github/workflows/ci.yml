name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bazel:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure Windows Bazel arguments
        if: matrix.os == 'windows-latest'
        run: echo "MSYS2_ARG_CONV_EXCL=//" >> "$GITHUB_ENV"

      - name: Show Bazel version
        run: bazel --version

      - name: Run unit tests
        run: bazel test --nocache_test_results //tests:inputs_manifest

      - name: Build example SBOM targets
        run: >
          bazel build
          //examples/node:hello_sbom
          //examples/go:hello_sbom
          //examples/python:hello_sbom
          //examples/node_complex:express_sbom
          //examples/go_complex:cobra_sbom
          //examples/python_complex:httpx_sbom

      - name: Preview generated SBOMs
        if: success()
        run: |
          python - <<'PY'
          import pathlib

          root = pathlib.Path('bazel-bin/examples')
          paths = sorted(root.rglob('*sbom.json'))
          if not paths:
              raise SystemExit('No SBOM files discovered')

          for path in paths:
              print(f"::group::{path}")
              try:
                  with path.open('r', encoding='utf-8') as fh:
                      for idx, line in zip(range(20), fh):
                          print(line.rstrip())
              finally:
                  print('::endgroup::')
          PY

      - name: Upload SBOM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sboms-${{ matrix.os }}
          path: |
            bazel-bin/examples/**/*.json
