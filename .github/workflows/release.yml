name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
      - name: Checkout repository
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v4
      - name: Build, upload source archive, and update README checksum
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="rules_sbom-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="rules_sbom-${VERSION}/" "${TAG_NAME}" -o "${ARCHIVE}"
          SHA=$(shasum -a 256 "${ARCHIVE}" | awk '{print $1}')
          gh release upload "${TAG_NAME}" "${ARCHIVE}"
          rm "${ARCHIVE}"
          sed -i "s/sha256 = \"[0-9a-f]\{64\}\"/sha256 = \"${SHA}\"/" README.md
          if git diff --quiet README.md; then
            echo "Checksum already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update checksum for ${TAG_NAME}"
            git push
          fi
      - name: Enrich release notes with install instructions
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python tools/update_release_notes.py \
            --repo "${REPOSITORY}" \
            --tag "${TAG_NAME}" \
            --version "${VERSION}"
          gh release edit "${TAG_NAME}" --notes-file release-body.md
